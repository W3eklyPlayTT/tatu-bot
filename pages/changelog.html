<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Changelog</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: purple;
      font-family: Arial, sans-serif;
    }

    .changelog-box {
      width: 500px;
      max-width: 90%;
      background: pink;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .changelog-box h1 {
      margin-top: 0;
      text-align: center;
    }

    .version {
      margin-bottom: 20px;
    }

    .version h2 {
      margin-bottom: 5px;
    }

    ul {
      margin: 0;
      padding-left: 20px;
    }
  </style>
</head>
<body>

  <div class="changelog-box">
    <h1>Changelog</h1>

    <div class="version">
      <h2>v1.2.0</h2>
      <ul>
        <li>Added new feature</li>
        <li>Improved performance</li>
        <li>Fixed minor bugs</li>
      </ul>
    </div>

    <div class="version">
      <h2>v1.1.0</h2>
      <ul>
        <li>UI improvements</li>
        <li>Bug fixes</li>
      </ul>
    </div>

    <div class="version">
      <h2>v1.0.0</h2>
      <ul>
        <li>Initial release</li>
      </ul>
    </div>

  </div>

</body>
</html>
